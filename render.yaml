services:
  - type: web
    name: zap2-studio
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: frankfurt
    envVars:
      - key: APP_NAME
        value: ZAP2
      - key: DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PUBLIC_URL
        value: https://zap2.onrender.com
      - key: WHISPER_MODEL
        value: base
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
    disk:
      name: zap2-disk
      mountPath: /app/storage
      sizeGB: 10
