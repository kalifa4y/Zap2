version: '3.8'

services:
  zap2-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zap2-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ZAP2
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=*
      - DATABASE_URL=sqlite:///./zap2.db
      - WHISPER_MODEL=base
      # External OAuth Credentials (Fill in your production values)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
    volumes:
      - zap2_storage:/app/storage
      - zap2_data:/app/backend

volumes:
  zap2_storage:
  zap2_data:
